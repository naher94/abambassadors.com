name: Update Hospitality Talks Episodes

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  update-episodes:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Generate episode files
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python3 _scripts/update-episodes.py

      - name: Commit new episodes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _hospitality-talks/
          git diff --staged --quiet || git commit -m "Auto-update Hospitality Talks episodes"
          git push
